<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Czech National Bank daily exchange rates and a CZK converter."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Koruna</title>
    <!-- Apply the saved colour scheme before first paint (see src/theme/colorScheme.ts). -->
    <script>
      try {
        const scheme = localStorage.getItem('koruna-color-scheme')
        if (scheme === 'light' || scheme === 'dark')
          document.documentElement.dataset.theme = scheme
      } catch {
        // Storage blocked (e.g. privacy settings): follow the system scheme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
