version: 2
updates:
  # Keeps the SHA-pinned actions in ci.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Wait a week before adopting a new release (supply-chain safety).
    cooldown:
      default-days: 7
    groups:
      dependencies:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
