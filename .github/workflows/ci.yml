name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Hardening follows GitHub's guide (SHA-pinned actions, read-only token):
# https://docs.github.com/en/actions/reference/security/secure-use
# Least privilege by default; jobs ask for more only if they need it.
permissions:
  contents: read

# New pushes to a PR cancel its older runs. Runs on main are never cancelled,
# so a deploy cannot be interrupted halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Unit tests (100 % coverage of domain logic)
        run: bun run test:coverage
      - name: Check Worker types are up to date
        run: bunx wrangler types --check
      - name: Build (includes typecheck)
        run: bun run build
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: End-to-end test of the main flow
        run: bun run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Audit dependencies for known vulnerabilities
        run: bun audit --audit-level=high

      # Deploy exactly what was verified: the built app plus wrangler's
      # pointer to the generated deploy config.
      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://momence.stadnik.dev
    # One production deploy at a time, in order.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build

      - name: Deploy
        run: bunx wrangler deploy --message "${GITHUB_SHA::7} ${GITHUB_WORKFLOW}#${GITHUB_RUN_NUMBER}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production
        run: |
          set -euo pipefail
          base=https://momence.stadnik.dev
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$base/" -o /dev/null \
              && curl -fsS "$base/api/rates" | grep -q '^Country|Currency|Amount|Code|Rate$'; then
              echo "Production is up and serving CNB rates."
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10 s…"
            sleep 10
          done
          echo "::error::Smoke test failed: $base is not serving the app or the rates."
          exit 1
